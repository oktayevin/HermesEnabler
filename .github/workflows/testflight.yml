name: TestFlight

# Every push to the working branch: build HermesCompanion (with the embedded
# HermesEnabler2 Watch app) on a Mac without signing, to prove it compiles.
# "Run workflow" with "Upload to TestFlight" ticked: signed build uploaded to
# App Store Connect. Signing uses an App Store Connect API key (repository
# secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 = the .p8 file's text) and the
# APPLE_TEAM_ID secret; Apple's cloud-managed signing creates the certificate
# and provisioning profiles, so nothing is stored in the repo.
# BUNDLE_ID is a repository variable (Watch becomes BUNDLE_ID.watchkitapp).

on:
  push:
    branches: [main]
    paths:
      - "HermesCompanion/**"
      - "HermesEnabler2/**"
      - "HermesEnabler2.xcodeproj/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: true
      marketing_version:
        description: "Version string (CFBundleShortVersionString). Empty = keep project value."
        required: false
        default: ""

concurrency:
  group: testflight-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Self-hosted runner with Xcode 27, which the
    # watchOS 27 SDK requires. GitHub-hosted macOS images don't ship Xcode 27 yet.
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
      MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
    steps:
      - uses: actions/checkout@v5

      # Newest stable Xcode on the runner (never a beta: Apple rejects beta builds
      # for release). The watchOS 27 SDK needs Xcode 27, so anything older stops here.
      - name: Use the latest stable Xcode
        run: |
          best=""; bestv="0"
          for app in /Applications/Xcode*.app; do
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" 2>/dev/null || echo 0)
            case "$app" in *[Bb]eta*) echo "skip beta $app ($v)"; continue;; esac
            echo "$app -> $v"
            if [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ] && [ "$v" != "$bestv" ]; then best="$app"; bestv="$v"; fi
          done
          X="$best"; MAJOR="${bestv%%.*}"
          if [ -z "$X" ] || [ "$MAJOR" -lt 27 ]; then echo "::error::Needs Xcode 27 or later for the watchOS 27 SDK (found: ${X:-none} $bestv)"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Build (unsigned check)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.testflight }}
        run: |
          xcodebuild build \
            -project HermesEnabler2.xcodeproj \
            -scheme HermesCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            COMPANION_BUNDLE_IDENTIFIER="${BUNDLE_ID:-com.example.HermesEnabler}" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

      - name: Check signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$BUNDLE_ID" ] && missing="$missing BUNDLE_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets/variables:$missing"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Signed build and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          build_number=$((BUILD_NUMBER + BUILD_NUMBER_OFFSET))
          extra=()
          [ -n "$MARKETING_VERSION_INPUT" ] && extra+=("MARKETING_VERSION=$MARKETING_VERSION_INPUT")
          echo "Build number: $build_number"

          # Archive with a local ad-hoc signature only (keeps the App Groups
          # entitlement but needs no certificate); the export below signs with
          # Apple's cloud-managed distribution certificate.
          xcodebuild -project HermesEnabler2.xcodeproj -scheme HermesCompanion -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HermesCompanion.xcarchive" \
            COMPANION_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$build_number" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO \
            "${extra[@]}" \
            archive | tail -40

          APP="$RUNNER_TEMP/HermesCompanion.xcarchive/Products/Applications/HermesCompanion.app"
          echo "Entitlements:"; codesign -d --entitlements - "$APP" 2>/dev/null || true
          echo "Embedded Watch app:"; ls "$APP/Watch" 2>/dev/null || echo "(none)"
          [ -d "$APP/Watch" ] || { echo "::error::Archive has no embedded Watch app"; exit 1; }

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HermesCompanion.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          echo "Uploaded build $build_number to App Store Connect. It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
